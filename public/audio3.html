<!DOCTYPE html>
<html class="no-js" lang="en">

<head>
    <title>Audio3</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="author" content="funplay" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="description"
        content="If you are looking for outdoor playground equipment manufacturer & supplier then you have came at right place." />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <!-- favicon icon -->
    <link rel="shortcut icon" href="images/favicon.png" />
    <link rel="apple-touch-icon" href="images/apple-touch-icon-57x57.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="images/apple-touch-icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="images/apple-touch-icon-114x114.png" />
    <link rel="stylesheet" href="css/vendors.min.css" />
    <link rel="stylesheet" href="css/icon.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
    <main>
        <div style="width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center;">
            <div>
                <div>
                    <audio autoplay muted controls id="audio">
                        <source src="/audio/Reverb-Cave.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                </div>
                <div class="mt-5">
                    <button class="btn btn-medium btn-dark-gray btn-box-shadow btn-round-edge submit m-auto d-block"
                        onclick="toggleAudio()" id="btn">Pause</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        function toggleAudio() {
            if (audio.muted) {
                audio.muted = false;
                audio.volume = 1;
            }

            if (audio.paused) {
                audio.play();
                btn.innerText = "Pause";
            } else {
                audio.pause();
                btn.innerText = "Play";
            }
        }
    </script>
</body>

</html>
